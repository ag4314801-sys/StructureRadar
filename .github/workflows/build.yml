name: Build Fabric Mod JARs (1.16.5 - 26.2)

on:
  push:
  workflow_dispatch:

jobs:
  build-jars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mod Source Code
        uses: actions/checkout@v4

      - name: Set up Java 25 (supports 26.2 and cross-compiles 1.16.5 - 1.21.4)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Compile & Remap All Mod .JARs
        run: gradle chiseledBuild --no-daemon

      - name: Upload Compiled .JAR Mods
        uses: actions/upload-artifact@v4
        with:
          name: StructureRadar-Fabric-JARs-All-Versions
          path: |
            versions/*/build/libs/*.jar
            build/libs/*.jar
            !**/*-sources.jar
            !**/*-dev.jar
